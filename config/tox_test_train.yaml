# Minimal config for running inference on CPU. See https://github.com/metno/bris-inference/wiki/Tests

start_date: 2022-01-01T00:00:00
end_date: 2022-01-02T00:00:00

checkpoints:
  forecaster:
    checkpoint_path: ./checkpoint-multi.ckpt
    leadtimes: 3

datasets:
  data: ./bris_random_data.zarr
  data2: 
    dataset: ./bris_random_data.zarr
    area: [80, -5, 45, 40]    
frequency: 6h
workdir: /tmp/

dataloader:
  datamodule:
    _target_: bris.data.dataset.NativeGridDataset
    _convert_: all

hardware:
  num_gpus_per_node: 1
  num_gpus_per_model: 1
  num_nodes: 1
  num_members: 1

release_cache: False

model:
  _target_: bris.model.BrisPredictor
  _convert_: all

routing:
  - decoder_name: "data"
    domain_index: 0
    outputs:
      - netcdf:
          filename_pattern: ./tox_test_inference_dec_data.nc
          variables: [2t, 2d]
          global_attributes:
            license: https://www.met.no/en/free-meteorological-data/Licensing-and-crediting
            creator_url: met.no
            institution: Norwegian Meteorological Institute, MET Norway
            comment: This file is generated by a tox test
      - grib:
          filename_pattern: ./tox_test_inference_dec_data.grib
          variables: [2t, 2d]
  - decoder_name: "data2"
    domain_index: 0
    outputs:
      - netcdf:
          filename_pattern: ./tox_test_inference_dec_data2.nc
          variables: [2t, tp]
          global_attributes:
            license: https://www.met.no/en/free-meteorological-data/Licensing-and-crediting
            creator_url: met.no
            institution: Norwegian Meteorological Institute, MET Norway
            comment: This file is generated by a tox test

loglevel: warning
