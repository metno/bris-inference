# Minimal config for running the interpolator between boundary states read from the dataset
# (no forecaster) on CPU. See https://github.com/metno/bris-inference/wiki/Tests

start_date: 2022-01-01T00:00:00
end_date: 2022-01-01T06:00:00

checkpoints:
  interpolator:
    checkpoint_path: ./checkpoint_interp.ckpt
    leadtimes: 2    # boundary intervals interpolated per forecast
    # boundary_timestep_seconds: 21600    # time between the boundary states; default from the checkpoint
    # static_forcings_dataset: ...        # default: the run's dataset

datasets:
  data: ./bris_random_data.zarr
frequency: 6h
workdir: /tmp/

dataloader:
  datamodule:
    _target_: bris.data.dataset.NativeGridDataset
    _convert_: all

hardware:
  num_gpus_per_node: 1
  num_gpus_per_model: 1
  num_nodes: 1
  num_members: 1

release_cache: False

model:
  _target_: bris.model.InterpolatorOnly
  _convert_: all

routing:
  - decoder_name: "data"
    domain_index: 0
    outputs:
      - netcdf:
          filename_pattern: ./tox_test_inference_interp_only.nc
          variables: [2t, 2d]
          extra_variables: [ws]
          accumulated_variables: [tp]
          global_attributes:
            license: https://www.met.no/en/free-meteorological-data/Licensing-and-crediting
            creator_url: met.no
            institution: Norwegian Meteorological Institute, MET Norway
            comment: This file is generated by a tox test

loglevel: warning
