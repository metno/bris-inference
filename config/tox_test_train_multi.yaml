# Minimal config for test training on CPU. See https://github.com/metno/bris-inference/wiki/Training

defaults:
- data: zarr
- dataloader: native_grid
- diagnostics: evaluation_ens
- system: example
- graph: multi_scale
- model: graphtransformer_ens
- task: forecaster
- training: ensemble
- _self_


hydra:
  output_subdir: null
  run:
    dir: .

config_validation: True

data:
  datasets:
    data2:
      forcing:
      - "cos_latitude"
      - "cos_longitude"
      - "sin_latitude"
      - "sin_longitude"
      - "cos_julian_day"
      - "cos_local_time"
      - "sin_julian_day"
      - "sin_local_time"
      - "insolation"
      - "lsm"
      - "z"
      diagnostic:
      - "tp"
    
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: "mean-std"
            std:
            - "tp"
            min-max:
            max:
            - "z"
            none:
            - "cos_latitude"
            - "cos_longitude"
            - "sin_latitude"
            - "sin_longitude"
            - "cos_julian_day"
            - "cos_local_time"
            - "sin_julian_day"
            - "sin_local_time"
            - "insolation"
            - "lsm"
    

dataloader:
  dataset: ${system.input.dataset}
  dataset2: 
    dataset: ${system.input.dataset}
    area: [80, -5, 45, 40]
    select:
    - "2t"
    - "tp"
    - "z"
    - "cos_latitude"
    - "cos_longitude"
    - "sin_latitude"
    - "sin_longitude"
    - "cos_julian_day"
    - "cos_local_time"
    - "sin_julian_day"
    - "sin_local_time"
    - "insolation"
    - "lsm" 

  num_workers:
    training: 2
    validation: 2
    test: 2

  limit_batches:
    training: 100
    validation: 100
    test: null

  batch_size:
    training: 1
    validation: 1
    test: 1

  training:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
          drop: []
        start: 2022-01-01
        end: 2022-01-31
        trajectory: ${dataloader.model_run_info}

      data2:
        dataset_config:
          dataset: ${dataloader.dataset2}
          frequency: ${data.frequency}
          drop: []
        start: 2022-01-01
        end: 2022-01-31
        trajectory: ${dataloader.model_run_info}

  validation:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
          drop: []
        start: 2022-02-01
        end: 2022-02-28
        trajectory: ${dataloader.model_run_info}

      data2:
        dataset_config:
          dataset: ${dataloader.dataset2}
          frequency: ${data.frequency}
          drop: []
        start: 2022-02-01
        end: 2022-02-28
        trajectory: ${dataloader.model_run_info}

  test: ${dataloader.validation}

diagnostics:
  checkpoint:
    every_n_minutes:
      num_models_saved: 0

    every_n_epochs:
      num_models_saved: 2
  plot:
    callbacks: []
  log:
    mlflow:
      tracking_uri: jajadingdong

system:
  input: 
    graph: training-output-multi/small_graph_20p0.pt
    dataset: ./bris_random_data.zarr
  output:
    root: training-output-multi/
  hardware:
    accelerator: auto
    num_gpus_per_ensemble: 1
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1


graph:
  overwrite: True
  nodes:
    data:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.training.datasets.data.dataset_config}
    hidden:
     node_builder:
        resolution: 3
    data2:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.training.datasets.data2.dataset_config}
      attributes: ${graph.attributes.nodes}


  edges:
  - source_name: "data"
    target_name: "hidden"
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges # options: KNNEdges, CutOffEdges
      num_nearest_neighbours: 3 # only for cutoff method
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: "data2"
    target_name: "hidden"
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges # options: KNNEdges, CutOffEdges
      num_nearest_neighbours: 3 # only for cutoff method
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: "hidden"
    target_name: "hidden"
    edge_builders:
    - _target_: anemoi.graphs.edges.MultiScaleEdges
      x_hops: 1
      scale_resolutions: ${graph.nodes.hidden.node_builder.resolution}
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: "hidden"
    target_name: "data"
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges # options: KNNEdges, CutOffEdges
      num_nearest_neighbours: 1 # only for knn method
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  - source_name: "hidden"
    target_name: "data2"
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges # options: KNNEdges, CutOffEdges
      num_nearest_neighbours: 1 # only for knn method
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}

  attributes:
    edges:
      edge_length:
        _target_: anemoi.graphs.edges.attributes.EdgeLength
        norm: unit-max

model:
  num_channels: 16
  trainable_parameters:
    data: 0
    hidden: 0
    data2hidden: 0
    hidden2data: 0
    hidden2hidden: 0

  bounding:
    - _target_: anemoi.models.layers.bounding.ReluBounding #[0, infinity)
      variables:
      - tp

training:
  run_id: null
  fork_run_id: null
  load_weights_only: False
  transfer_learning: False
  max_epochs: null
  max_steps: 300

  optimization:
    lr_scheduler:
      warmup_t: 10
    lr: 6.25e-05

  training_loss:
    datasets:
      data2:
        _target_: anemoi.training.losses.kcrps.AlmostFairKernelCRPS
        scalers: ['pressure_level', 'general_variable', 'nan_mask_weights', 'node_weights', 'time_steps']
        ignore_nans: False
        no_autocast: True
        alpha: 0.95
  validation_metrics:
    datasets:
      data2: 
        fkcrps:
          _target_: anemoi.training.losses.kcrps.AlmostFairKernelCRPS
          scalers: ['node_weights']
          ignore_nans: False
          no_autocast: True
          alpha: 0.95

  variable_groups:
    datasets:
      data2: ${training.variable_groups.datasets.data}
  metrics:
    datasets:
      data2: []

  scalers:
    datasets:
      data2:
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
            q: 0.6 #1
            t: 6   #1
            u: 0.8 #0.5
            v: 0.5 #0.33
            w: 0.001
            z: 12  #1
            sp: 10
            10u: 0.1
            10v: 0.1
            2d: 0.5
            tp: 0.025
            cp: 0.0025

        pressure_level:
          _target_: anemoi.training.losses.scalers.ReluVariableLevelScaler
          group: pl
          y_intercept: 0.2
          slope: 0.001

        # mask NaNs with zeros in the loss function
        nan_mask_weights:
          _target_: anemoi.training.losses.scalers.NaNMaskScaler

        # Scalers from node attributes
        node_weights:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          nodes_attribute_name: area_weight
          norm: unit-sum

      # Scalers in the time dimension
        time_steps:
          _target_: anemoi.training.losses.scalers.UniformTimeStepScaler